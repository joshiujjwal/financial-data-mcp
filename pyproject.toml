[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "financial-data-mcp"
version = "0.1.0"
description = "AI agent that queries real-time and historical financial data via the Financial Datasets MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
financial-agent = "src.agent:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
